# Cloudflare Pages: the static site in dist/ plus the account API in functions/.
# Secrets (never in this file): GOOGLE_CLIENT_SECRET, PADDLE_API_KEY, PADDLE_WEBHOOK_SECRET.
#   npx wrangler pages secret put <NAME> --project-name orilos
name = "orilos"
pages_build_output_dir = "dist"
compatibility_date = "2026-06-01"

[[d1_databases]]
binding = "DB"
database_name = "orilos"
database_id = "0be19fa1-221b-42c7-b3d2-632db1a8eff8"
migrations_dir = "migrations"

# ORILOS Connect relay (a separate Worker: bridge/), one Durable Object per account.
[[durable_objects.bindings]]
name = "BRIDGE"
class_name = "Bridge"
script_name = "orilos-bridge"

[vars]
GOOGLE_CLIENT_ID = "260389162338-mjr340f21kjno8ch1b6tqe17oulq62ld.apps.googleusercontent.com"
# Paddle: "sandbox" while testing, "production" when live. The client token and price IDs are public.
PADDLE_ENV = "sandbox"
PADDLE_CLIENT_TOKEN = "test_c81a4116a2424e78d34bab6ca9a"
PADDLE_PRICE_PRO_MONTHLY = "pri_01m86mk2xckgjh77r5z10ja6hz"
PADDLE_PRICE_PRO_YEARLY = "pri_01m86mmr5jdb6bkb9br0dzmdv9"
PADDLE_PRICE_TEAM_MONTHLY = "pri_01m86mr2hpb73f9sf7ehx03yxx"
PADDLE_PRICE_TEAM_YEARLY = "pri_01m86ms583ev5evmj9d4pnszt1"
